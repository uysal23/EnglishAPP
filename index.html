<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #FDF8F3;
  color: #3D3D3D;
  min-height: 100vh;
  overflow-x: hidden;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FDF8F3; position: relative; }

/* HEADER */
.header {
  background: linear-gradient(135deg, #6B8E6B 0%, #4A6B4A 100%);
  color: white;
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.header .row { display: flex; justify-content: space-between; align-items: center; }

/* WELCOME BANNER */
.welcome {
  background: linear-gradient(135deg, #6B8E6B 0%, #4A6B4A 100%);
  color: white;
  padding: 20px 16px 32px;
}
.welcome .greet { font-size: 14px; opacity: 0.85; }
.welcome .title { font-size: 22px; font-weight: 700; margin: 4px 0 12px; }
.stats { display: flex; gap: 16px; font-size: 13px; }
.stat { display: flex; align-items: center; gap: 4px; }

/* CONTENT */
.content { padding: 16px; padding-bottom: 80px; }

/* LEVEL CARD */
.level-card {
  background: #FFFDF9;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex;
  align-items: center;
  gap: 14px;
}
.level-card:active { transform: scale(0.98); }
.level-card.locked { opacity: 0.55; cursor: not-allowed; }
.level-icon {
  width: 56px; height: 56px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}
.level-info { flex: 1; }
.level-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.level-desc { font-size: 12px; color: #888; margin-bottom: 8px; }
.progress-bar { height: 5px; background: #E5E5E5; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: #6B8E6B; border-radius: 3px; transition: width 0.3s; }
.chevron { color: #CCC; font-size: 20px; }

/* SCENE CARD */
.scene-card {
  background: #FFFDF9; border-radius: 14px; padding: 14px;
  margin-bottom: 10px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  transition: transform 0.15s;
}
.scene-card:active { transform: scale(0.98); }
.scene-num {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.scene-num.done { background: rgba(76,175,80,0.15); color: #4CAF50; }
.scene-num.todo { background: rgba(33,150,243,0.15); color: #2196F3; }
.scene-info { flex: 1; }
.scene-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
.scene-gram { font-size: 11px; color: #888; }

/* BACK BUTTON */
.back-btn {
  background: none; border: none; color: white; font-size: 24px;
  cursor: pointer; padding: 0 8px 0 0; line-height: 1;
}

/* SCENE VIEWER */
.scene-viewer { position: relative; min-height: calc(100vh - 60px); background: #1a1a1a; }
.scene-bg {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #4A6B4A 0%, #2C3E2C 100%);
  display: flex; align-items: center; justify-content: center;
}
.scene-loc { color: rgba(255,255,255,0.4); font-size: 18px; text-align: center; padding: 20px; }
.characters-row {
  position: absolute; bottom: 200px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  padding: 0 20px;
}
.char-chip {
  padding: 6px 12px; border-radius: 20px;
  background: rgba(255,255,255,0.1);
  color: white; font-size: 12px;
  border: 2px solid transparent;
  transition: all 0.3s;
}
.char-chip.active {
  background: #6B8E6B; border-color: white;
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(107,142,107,0.6);
}
.subtitle-box {
  position: absolute; bottom: 100px; left: 16px; right: 16px;
  background: rgba(0,0,0,0.85); border-radius: 12px;
  padding: 14px;
}
.subtitle-char { color: #9ECF9E; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.subtitle-text { color: white; font-size: 15px; line-height: 1.4; }
.subtitle-stage { color: rgba(255,255,255,0.5); font-size: 12px; font-style: italic; margin-top: 6px; }

/* SCENE CONTROLS */
.scene-controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #000; padding: 12px 16px 16px;
  max-width: 480px; margin: 0 auto;
}
.ctrl-progress { height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.ctrl-progress-fill { height: 100%; background: #6B8E6B; transition: width 0.3s; }
.ctrl-row { display: flex; justify-content: space-between; align-items: center; }
.ctrl-btn {
  background: rgba(255,255,255,0.1); border: none; color: white;
  padding: 10px 16px; border-radius: 10px; font-size: 14px;
  cursor: pointer; font-weight: 600;
}
.ctrl-btn:disabled { opacity: 0.3; }
.ctrl-btn.primary { background: #6B8E6B; }
.ctrl-count { color: white; font-size: 13px; }

/* EXERCISE */
.exercise-container { padding: 16px; }
.gram-badge {
  display: inline-block; padding: 4px 12px; border-radius: 12px;
  background: rgba(33,150,243,0.1); color: #2196F3;
  font-size: 11px; font-weight: 600; margin-bottom: 12px;

.question { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 16px; border-radius: 12px; background: #F5F5F5;
  cursor: pointer; font-size: 15px;
  border: 2px solid transparent; transition: all 0.2s;
}
.option.selected { background: rgba(33,150,243,0.08); border-color: #2196F3; }
.option.correct { background: rgba(76,175,80,0.15); border-color: #4CAF50; }
.option.wrong { background: rgba(244,67,54,0.12); border-color: #F44336; }

/* BUTTONS */
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: transform 0.15s;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: #6B8E6B; color: white; }
.btn-secondary { background: #F0F0F0; color: #333; }
.btn-danger { background: #F44336; color: white; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-row .btn { margin: 0; }

/* FLASHCARD */
.flashcard-wrap { perspective: 1000px; height: 340px; margin-bottom: 16px; }
.flashcard {
  position: relative; width: 100%; height: 100%;
  transition: transform 0.6s; transform-style: preserve-3d;
  cursor: pointer;
}
.flashcard.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 16px; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.fc-front { background: white; }
.fc-back { background: linear-gradient(135deg, #6B8E6B, #4A6B4A); color: white; transform: rotateY(180deg); }
.fc-word { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
.fc-hint { color: #999; font-size: 12px; margin-top: 16px; }
.fc-def { font-size: 16px; line-height: 1.5; margin-bottom: 16px; }
.fc-example { background: rgba(255,255,255,0.15); padding: 12px; border-radius: 10px; font-style: italic; font-size: 14px; line-height: 1.4; }

/* EXAM */
.exam-header { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 13px; color: #666; }
.exam-status {
  padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
  font-size: 13px; font-weight: 600;

.exam-status.vocab { background: rgba(33,150,243,0.1); color: #2196F3; }
.exam-status.gram { background: rgba(156,39,176,0.1); color: #9C27B0; }

/* RESULT */
.result-card {
  background: white; border-radius: 20px; padding: 32px 24px;
  text-align: center; margin: 20px 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);

.result-emoji { font-size: 72px; margin-bottom: 16px; }
.result-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
.score-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px; border-radius: 12px; margin-bottom: 10px;
}
.score-row.pass { background: rgba(76,175,80,0.1); }
.score-row.fail { background: rgba(244,67,54,0.1); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 1000;

.modal {
  background: white; border-radius: 16px; padding: 24px;
  max-width: 380px; width: 100%; text-align: center;
}
.modal h3 { font-size: 20px; margin-bottom: 12px; }
.modal p { color: #666; line-height: 1.5; margin-bottom: 20px; }

/* CONFETTI */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; }

/* HIDDEN */
.hidden { display: none !important; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease-out; }
</style>

      </div>
    </div>
    <div class="content">
      ${LEVELS.map(lvl => {
        const scenes = SCENES[lvl.id] || [];
        const doneCount = scenes.filter(s => App.progress[s.id]).length;
        const pct = scenes.length ? (doneCount / scenes.length) * 100 : 0;
        const locked = scenes.length === 0;
        return `
          <div class="level-card ${locked ? 'locked' : ''}" onclick="openLevel('${lvl.id}')">
            <div class="level-icon" style="background: ${lvl.color}22; color: ${lvl.color}">
              ${lvl.icon}
            </div>
            <div class="level-info">
              <div class="level-name">${lvl.name}</div>
              <div class="level-desc">${scenes.length ? `${doneCount} / ${scenes.length} scenes` : 'Coming soon'}</div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${pct}%; background: ${lvl.color}"></div>
              </div>
            </div>
            <div class="chevron">›</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderLevel() {
  const lvl = LEVELS.find(l => l.id === App.currentLevel);
  const scenes = SCENES[App.currentLevel] || [];
  return `
    <div class="header">
      <div class="row">
        <button class="back-btn" onclick="goHome()">‹</button>
        <h1>${lvl.name}</h1>
      </div>
      <div class="sub">${scenes.length} scenes</div>
    </div>
    <div class="content">
      ${scenes.map((s, i) => {
        const done = !!App.progress[s.id];
        return `
          <div class="scene-card" onclick="openScene('${s.id}')">
            <div class="scene-num ${done ? 'done' : 'todo'}">
              ${done ? '✓' : (i + 1)}
            </div>
            <div class="scene-info">
              <div class="scene-title">${s.title}</div>
              <div class="scene-gram">${s.grammar}</div>
            </div>
            <div class="chevron">›</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderScene() {
  const s = App.currentScene;
  const d = s.dialogues[App.currentDialogueIdx];
  const total = s.dialogues.length;
  const pct = ((App.currentDialogueIdx + 1) / total) * 100;

  return `
    <div class="scene-viewer" style="min-height: 100vh;">
      <div class="scene-bg">
        <div class="scene-loc">📍 ${s.location}</div>
      </div>
      <div class="characters-row">
        ${s.characters.map(c => `
          <div class="char-chip ${c === d.c ? 'active' : ''}">${c}</div>
        `).join('')}
      </div>
      <div class="subtitle-box">
        <div class="subtitle-char">${d.c}</div>
        <div class="subtitle-text">${d.t}</div>
        ${d.s ? `<div class="subtitle-stage">${d.s}</div>` : ''}
      </div>
      <div class="scene-controls">
        <div class="ctrl-progress">
          <div class="ctrl-progress-fill" style="width: ${pct}%"></div>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn" onclick="prevDialogue()" ${App.currentDialogueIdx === 0 ? 'disabled' : ''}>‹ Prev</button>
          <div class="ctrl-count">${App.currentDialogueIdx + 1} / ${total}</div>
          <button class="ctrl-btn" onclick="nextDialogue()" ${App.currentDialogueIdx === total - 1 ? 'disabled' : ''}>Next ›</button>
        </div>
        <div style="margin-top: 10px;">
          <button class="ctrl-btn primary" style="width: 100%; padding: 14px;" onclick="startExercises()">
            Start Exercises →
          </button>
        </div>
        <div style="margin-top: 10px;">
          <button class="ctrl-btn" style="width: 100%; background: transparent;" onclick="backToLevel()">Skip</button>
        </div>
      </div>
    </div>
  `;
}

function renderExercise() {
  const s = App.currentScene;
  const exercises = s.exercises;
  if (App.exerciseIdx >= exercises.length) {
    // Go to flashcards
    setTimeout(() => { App.screen = 'flashcard'; App.flashcardIdx = 0; App.flashcardFlipped = false; render(); }, 0);
    return '';
  }
  const ex = exercises[App.exerciseIdx];
  const pct = ((App.exerciseIdx + 1) / exercises.length) * 100;

  return `
    <div class="header">
      <div class="row">
        <button class="back-btn" onclick="backToLevel()">‹</button>
        <h1>Exercise ${App.exerciseIdx + 1}/${exercises.length}</h1>
      </div>
      <div class="progress-bar" style="margin-top: 8px; height: 4px; background: rgba(255,255,255,0.2);">
        <div style="height: 100%; width: ${pct}%; background: white;"></div>
      </div>
    </div>
    <div class="exercise-container fade-in">
      <div class="gram-badge">${s.grammar}</div>
      <div class="question">${ex.q}</div>
      <div class="options">
        ${ex.o.map((o, i) => {
          let cls = 'option';
          if (App.exerciseAnswered) {
            if (o === ex.a) cls += ' correct';
            else if (App.exerciseSelected === i) cls += ' wrong';
          } else if (App.exerciseSelected === i) cls += ' selected';
          return `<div class="${cls}" onclick="selectOption(${i})">${o}</div>`;
        }).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="checkExercise()" ${App.exerciseSelected === null ? 'disabled' : ''}>
          ${App.exerciseAnswered ? (App.exerciseIdx < exercises.length - 1 ? 'Next' : 'Flashcards →') : 'Check'}
        </button>
      </div>
    </div>
  `;
}

function renderFlashcard() {
  const s = App.currentScene;
  const cards = s.vocab;
  if (App.flashcardIdx >= cards.length) {
    setTimeout(() => { App.screen = 'exam'; App.examStage = 'vocabulary'; App.examIdx = 0; App.examCorrect = 0; App.examAnswered = false; App.examSelected = null; render(); }, 0);
    return '';
  }
  const card = cards[App.flashcardIdx];
  return `
    <div class="header">
      <div class="row">
        <button class="back-btn" onclick="backToLevel()">‹</button>
        <h1>Flashcard ${App.flashcardIdx + 1}/${cards.length}</h1>
      </div>
    </div>
    <div class="exercise-container fade-in">
      <div class="flashcard-wrap">
        <div class="flashcard ${App.flashcardFlipped ? 'flipped' : ''}" onclick="flipCard()">
          <div class="fc-face fc-front">
            <div class="fc-word">${card[0]}</div>
            <div class="fc-hint">👆 Tap to flip</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-def">${card[1]}</div>
            <div class="fc-example">"${card[2]}"</div>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="nextFlashcard()">Review Again</button>
        <button class="btn btn-primary" onclick="nextFlashcard()">I Know This ✓</button>
      </div>
      <button class="btn" style="margin-top: 12px; background: transparent; color: #666;"
        onclick="startExam()">Skip to Exam →</button>
    </div>
  `;
}

function renderExam() {
  const s = App.currentScene;
  const isVocab = App.examStage === 'vocabulary';
  const questions = isVocab ? s.vocabExam : s.grammarExam;
  if (App.examIdx >= questions.length) {
    // Move to next stage
    setTimeout(() => { finishExamStage(); }, 0);
    return '';
  }
  const q = questions[App.examIdx];
  const threshold = isVocab ? 90 : 85;
  const pct = ((App.examIdx + 1) / questions.length) * 100;

  return `
    <div class="header" style="background: ${isVocab ? '#2196F3' : '#9C27B0'};">
      <div class="row">
        <button class="back-btn" onclick="backToLevel()">‹</button>
        <h1>${isVocab ? 'Vocabulary Exam' : 'Grammar Exam'}</h1>
      </div>
      <div class="progress-bar" style="margin-top: 8px; height: 4px; background: rgba(255,255,255,0.2);">
        <div style="height: 100%; width: ${pct}%; background: white;"></div>
      </div>
    </div>
    <div class="exercise-container fade-in">
      <div class="exam-status ${isVocab ? 'vocab' : 'gram'}">
        Pass threshold: ${threshold}% · Score: ${App.examCorrect}/${App.examIdx + (App.examAnswered ? 1 : 0)}
      </div>
      <div class="question">${q.q}</div>
      <div class="options">
        ${q.o.map((o, i) => {
          let cls = 'option';
          if (App.examAnswered) {
            if (o === q.a) cls += ' correct';
            else if (App.examSelected === i) cls += ' wrong';
          } else if (App.examSelected === i) cls += ' selected';
          return `<div class="${cls}" onclick="selectExamOption(${i})">${o}</div>`;
        }).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="checkExam()" ${App.examSelected === null ? 'disabled' : ''}>
          ${App.examAnswered ? 'Next' : 'Check'}
        </button>
      </div>
    </div>
  `;
}

function renderDone() {
  const vocab = App.vocabScore;
  const gram = App.grammarScore;
  const passed = vocab >= 90 && gram >= 85;
  return `
    <div class="result-card fade-in">
      <div class="result-emoji">${passed ? '🏆' : '📚'}</div>
      <div class="result-title">${passed ? 'Scene Completed!' : 'Keep Practicing!'}</div>
      <div style="color: #666; margin-bottom: 24px;">${App.currentScene.title}</div>
      <div class="score-row ${vocab >= 90 ? 'pass' : 'fail'}">
        <span>Vocabulary</span>
        <strong>${vocab}%</strong>
      </div>
      <div class="score-row ${gram >= 85 ? 'pass' : 'fail'}">
        <span>Grammar</span>
        <strong>${gram}%</strong>
      </div>
      <div class="btn-row" style="margin-top: 24px;">
        <button class="btn btn-secondary" onclick="retryScene()">Retry</button>
        <button class="btn btn-primary" onclick="goHome()">Home</button>
      </div>
    </div>
  `;
}

// ============ ACTIONS ============
function goHome() {
  App.screen = 'home';
  App.currentLevel = null;
  App.currentScene = null;
  render();
}

function openLevel(id) {
  if (!SCENES[id] || SCENES[id].length === 0) {
    alert('This level is coming soon!');
    return;
  }
  App.currentLevel = id;
  App.screen = 'level';
  render();
}

function openScene(id) {
  const s = SCENES[App.currentLevel].find(x => x.id === id);
  if (!s) return;
  App.currentScene = s;
  App.currentDialogueIdx = 0;
  App.screen = 'scene';
  render();
}

function backToLevel() {
  App.screen = 'level';
  App.currentScene = null;
  render();
}

function prevDialogue() {
  if (App.currentDialogueIdx > 0) {
    App.currentDialogueIdx--;
    render();
  }
}

function nextDialogue() {
  if (App.currentDialogueIdx < App.currentScene.dialogues.length - 1) {
    App.currentDialogueIdx++;
    render();
  }
}

function startExercises() {
  App.screen = 'exercise';
  App.exerciseIdx = 0;
  App.exerciseCorrect = 0;
  App.exerciseAnswered = false;
  App.exerciseSelected = null;
  render();
}

function selectOption(i) {
  if (App.exerciseAnswered) return;
  App.exerciseSelected = i;
  render();
}

function checkExercise() {
  const ex = App.currentScene.exercises[App.exerciseIdx];
  if (!App.exerciseAnswered) {
    App.exerciseAnswered = true;
    if (ex.o[App.exerciseSelected] === ex.a) App.exerciseCorrect++;
    render();
  } else {
    App.exerciseIdx++;
    App.exerciseSelected = null;
    App.exerciseAnswered = false;
    render();
  }
}

function flipCard() {
  App.flashcardFlipped = !App.flashcardFlipped;
  render();
}

function nextFlashcard() {
  App.flashcardIdx++;
  App.flashcardFlipped = false;
  render();
}

function startExam() {
  App.screen = 'exam';
  App.examStage = 'vocabulary';
  App.examIdx = 0;
  App.examCorrect = 0;
  App.examAnswered = false;
  App.examSelected = null;
  render();
}

function selectExamOption(i) {
  if (App.examAnswered) return;
  App.examSelected = i;
  render();
}

function checkExam() {
  const s = App.currentScene;
  const isVocab = App.examStage === 'vocabulary';
  const questions = isVocab ? s.vocabExam : s.grammarExam;
  const q = questions[App.examIdx];

  if (!App.examAnswered) {
    App.examAnswered = true;
    if (q.o[App.examSelected] === q.a) App.examCorrect++;
    render();
  } else {
    App.examIdx++;
    App.examSelected = null;
    App.examAnswered = false;
    render();
  }
}

function finishExamStage() {
  const s = App.currentScene;
  const isVocab = App.examStage === 'vocabulary';
  const questions = isVocab ? s.vocabExam : s.grammarExam;
  const score = Math.round((App.examCorrect / questions.length) * 100);
  const threshold = isVocab ? 90 : 85;

  if (score < threshold) {
    // Fail - retry
    if (confirm(`${isVocab ? 'Vocabulary' : 'Grammar'} Score: ${score}%\nRequired: ${threshold}%\n\nRetry?`)) {
      App.examIdx = 0;
      App.examCorrect = 0;
      App.examAnswered = false;
      App.examSelected = null;
      render();
    } else {
      backToLevel();
    }
    return;
  }

  if (isVocab) {
    App.vocabScore = score;
    // Move to grammar exam
    App.examStage = 'grammar';
    App.examIdx = 0;
    App.examCorrect = 0;
    App.examAnswered = false;
    App.examSelected = null;
    render();
  } else {
    App.grammarScore = score;
    // Complete scene
    App.progress[s.id] = { vocab: App.vocabScore, gram: score };
    App.totalXP += 50;
    saveProgress();
    App.screen = 'done';
    render();
  }
}

function retryScene() {
  App.screen = 'scene';
  App.currentDialogueIdx = 0;
  render();
}

// ============ INIT ============
render();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
</body>
</html>
